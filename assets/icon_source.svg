<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Red gradient background matching YouTube's brand color -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   style="stop-color:#ff7a7a;stop-opacity:1"/>
      <stop offset="55%"  style="stop-color:#ff0000;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#990000;stop-opacity:1"/>
    </linearGradient>

    <!-- Ambient electric glow behind the central icon -->
    <radialGradient id="ambient-glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%"   style="stop-color:#ffb3b3;stop-opacity:0.55"/>
      <stop offset="60%"  style="stop-color:#ff4d4d;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#ff4d4d;stop-opacity:0"/>
    </radialGradient>

    <!-- Base File / Polaroid Gradient -->
    <linearGradient id="base-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   style="stop-color:#ffffff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1"/>
    </linearGradient>

    <!-- Inner Video Area Gradient -->
    <linearGradient id="video-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   style="stop-color:#1e293b;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1"/>
    </linearGradient>

    <!-- High-quality drop shadow -->
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="24"/>
      <feOffset dx="0" dy="24" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.45"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background: Squircle -->
  <rect x="0" y="0" width="1024" height="1024" rx="225" ry="225" fill="url(#bg-grad)"/>

  <!-- Ambient electric glow -->
  <rect x="0" y="0" width="1024" height="1024" rx="225" ry="225" fill="url(#ambient-glow)"/>

  <!-- Minimalist Video-to-Image (Polaroid style) Icon -->
  <g transform="translate(512, 512)" filter="url(#soft-shadow)">
    
    <!-- Base White Document/Frame -->
    <rect x="-300" y="-350" width="600" height="700" rx="64" fill="url(#base-grad)"/>
    <!-- Subtle highlight border for depth -->
    <rect x="-300" y="-350" width="600" height="700" rx="64" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="4"/>

    <!-- Inner Dark Video Frame -->
    <rect x="-250" y="-300" width="500" height="440" rx="36" fill="url(#video-grad)"/>
    <rect x="-250" y="-300" width="500" height="440" rx="36" fill="none" stroke="rgba(0,0,0,0.3)" stroke-width="2"/>

    <!-- Minimalist Play Triangle -->
    <polygon points="50,-80 -30,-130 -30,-30" 
             fill="#ffffff" 
             stroke="#ffffff" 
             stroke-width="24" 
             stroke-linejoin="round" 
             opacity="0.95"/>

    <!-- Bold, Clean "VID" Typography -->
    <text x="0" y="290" 
          font-family="system-ui, -apple-system, Helvetica, sans-serif" 
          font-size="140" 
          font-weight="900" 
          fill="#ff0000" 
          text-anchor="middle" 
          letter-spacing="4">VID</text>
  </g>

  <!-- Subtle top sheen on the main squircle (Tahoe glass effect) -->
  <path d="M 0 0 H 1024 V 320 Q 512 460 0 320 Z" fill="rgba(255,255,255,0.08)"/>
</svg>
